<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi - Thư Viện Hội Đoàn GenZ</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        .hidden {
    display: none;
}

.main-content {
    max-width: 800px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

.page-title {
    font-size: 28px;
    font-weight: bold;
    color: #333;
}

.btn {
    padding: 10px 15px;
    margin: 5px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s ease;
}

.btn-primary {
    background-color: #007bff;
    color: white;
    border: none;
}

.btn-success {
    background-color: #28a745;
    color: white;
}

.btn-danger {
    background-color: #dc3545;
    color: white;
}

.btn:hover {
    opacity: 0.8;
}

.game-form {
    background: #f9f9f9;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    margin-top: 15px;
    text-align: left;
}

.game-form input, .game-form textarea {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.form-buttons {
    display: flex;
    justify-content: space-between;
}

.section-title {
    margin-top: 20px;
    font-size: 22px;
    color: #333;
}

.game-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
}

.game-card {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    width: 300px;
    text-align: left;
    transition: 0.3s ease;
}

.game-card:hover {
    transform: scale(1.05);
}

.btn-delete {
    background-color: #ff4d4d;
    color: white;
    border: none;
}

    </style>
</head>
<body>
    <nav class="navigation-bar">
        <div class="nav-container">
            <a href="#" class="logo">Thư viện Hội Đoàn GenZ</a>
            <ul class="nav-links">
                <li><a href="#">Trang Chủ</a></li>
                <li><a href="books.html">Sách</a></li>
                <li><a href="lectures.html">Bài Giảng</a></li>
                <li><a href="games.html">Trò chơi</a></li>
                <li><a href="documents.html">Văn bản</a></li>
                <li><a href="#">Liên Hệ</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-content">
        <h1 class="page-title">🎮 Trò Chơi Hội Đoàn</h1>
        <button id="add-game-btn" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Thêm Trò Chơi
        </button>

        <!-- Form nhập thông tin trò chơi -->
        <div id="game-form" class="game-form hidden">
            <h2>Thêm Trò Chơi Mới</h2>
            <label for="game-name">📌 Tên trò chơi:</label>
            <input type="text" id="game-name" placeholder="Nhập tên trò chơi" required>

            <label for="game-players">👥 Số lượng người chơi:</label>
            <input type="number" id="game-players" placeholder="Nhập số lượng" required>

            <label for="game-rules">📖 Luật chơi:</label>
            <textarea id="game-rules" placeholder="Mô tả luật chơi..." required></textarea>

            <div class="form-buttons">
                <button id="save-game-btn" class="btn btn-success">
                    <i class="bi bi-save"></i> Lưu
                </button>
                <button id="cancel-game-btn" class="btn btn-danger">
                    <i class="bi bi-x-circle"></i> Hủy
                </button>
            </div>
        </div>

        <!-- Danh sách trò chơi -->
        <h2 class="section-title">📋 Danh sách Trò Chơi</h2>
        <div id="game-list" class="game-list"></div>
    </div>

    <script src="js/games.js"></script>
</body>
</html>
