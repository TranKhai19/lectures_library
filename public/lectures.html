<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Bài Giảng</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
    <!-- Thanh Điều Hướng -->
    <nav class="navigation-bar">
        <div class="nav-container">
            <a href="index.html" class="logo">Thư Viện</a>
            <ul class="nav-links">
                <li><a href="index.html">Trang Chủ</a></li>
                <li><a href="books.html">Sách</a></li>
                <li><a href="lectures.html">Bài Giảng</a></li>
                <li><a href="#">Liên Hệ</a></li>
            </ul>
        </div>
    </nav>

    <!-- Nội Dung Chính -->
    <div class="main-content">
        <button id="toggleUploadForm">Thêm tài liệu</button>

        <!-- Form Upload (Ẩn mặc định) -->
        <div class="upload-container" id="uploadForm" style="display: none;">
            <input type="file" id="fileInput" accept=".pdf,.doc,.ppt">
            <select id="categorySelect">
                <option value="Công nghệ">Công nghệ</option>
                <option value="Khoa học">Khoa học</option>
                <option value="Toán học">Toán học</option>
                <option value="Lịch sử">Lịch sử</option>
                <option value="Ngôn ngữ">Ngôn ngữ</option>
            </select>
            <button id="uploadBtn">Tải lên</button>
        </div>

        <!-- Danh sách bài giảng -->
        <h1>Danh sách bài giảng</h1>
        <ul id="lecturesList"></ul>

        <!-- Điều hướng phân trang -->
        <div class="pagination">
            <button id="prevPage" disabled>❮ Trang trước</button>
            <span id="pageIndicator">Trang 1</span>
            <button id="nextPage">Trang sau ❯</button>
        </div>
    </div>

    <script src="js/lectures.js"></script>
</body>
</html>
