<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện - Bài Giảng</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
    <!-- Thanh Điều Hướng -->
    <nav class="navigation-bar">
        <div class="nav-container">
            <a href="index.html" class="logo">Thư Viện</a>
            <ul class="nav-links">
                <li><a href="index.html">Trang Chủ</a></li>
                <li><a href="books.html">Sách</a></li>
                <li><a href="lectures.html">Bài Giảng</a></li>
                <li><a href="#">Liên Hệ</a></li>
            </ul>
        </div>
    </nav>

    <!-- Nội Dung Chính -->
    <div class="main-content">
        <section class="hero">
            <h1>Danh Sách Bài Giảng</h1>
            <p>Khám phá các bài giảng có sẵn trong thư viện của chúng tôi.</p>
        </section>
        <section class="lecture-list" id="lecture-list">
            <!-- Bài giảng sẽ được hiển thị ở đây -->
        </section>
        <section class="upload-section">
            <h2>Upload Bài Giảng</h2>
            <form id="upload-form">
                <input type="text" id="lecture-name" placeholder="Tên bài giảng">
                <textarea id="lecture-description" placeholder="Mô tả ngắn"></textarea>
                <input type="file" id="lecture-file" accept=".docx, .pptx, .pdf">
                <button type="submit">Upload</button>
            </form>
        </section>
    </div>

    <script src="js/scripts.js"></script>
</body>
</html>
