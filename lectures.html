<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện - Bài Giảng</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        .upload-lecture {
            display: none;
        }
        .chatbot-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
        }

        .chatbot-window {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 300px;
            height: 400px;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            background-color: white;
            z-index: 1000;
            display: none;
        }

        .chat-area {
            height: 350px;
            overflow-y: auto;
            padding: 10px;
        }

        #user-input {
            width: calc(100% - 60px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #send-button {
            width: 50px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Thanh Điều Hướng -->
    <nav class="navigation-bar">
        <div class="nav-container">
            <a href="index.html" class="logo">Thư Viện</a>
            <ul class="nav-links">
                <li><a href="index.html">Trang Chủ</a></li>
                <li><a href="books.html">Sách</a></li>
                <li><a href="lectures.html">Bài Giảng</a></li>
                <li><a href="#">Liên Hệ</a></li>
            </ul>
        </div>
    </nav>

    <!-- Giới Thiệu -->
    <div class="page-intro">
        <h1>📚 Chào Mừng Đến Với Thư Viện Bài Giảng</h1>
        <p>Trang này cung cấp các bài giảng hữu ích. Bạn có thể tải lên và chia sẻ bài giảng của mình.</p>
    </div>

    <!-- Thông Báo -->
    <div id="uploadMessage" class="alert-message"></div>

    <!-- Danh Sách Bài Giảng -->
    <div class="lectures-container">
        <h2>📂 Danh Sách Bài Giảng</h2>
        <ul class="lectures-list">
            <!-- Danh sách bài giảng sẽ được tải từ server -->
        </ul>
    </div>

    <!-- Nút Thêm -->
    <button class="btn-add" onclick="toggleUploadForm()">+ Thêm Bài Giảng</button>

    <!-- Form Upload -->
    <div class="upload-lecture" id="uploadForm">
        <h2>📤 Tải Lên Bài Giảng Mới</h2>
        <form onsubmit="handleUpload(event)" enctype="multipart/form-data">
            <label for="lectureFile">Chọn File:</label>
            <input type="file" id="lectureFile" name="lectureFile" required>
            <label for="lectureCategory">Chọn Lĩnh Vực:</label>
            <select id="lectureCategory" name="lectureCategory" required>
                <option value="Địa Lí">Địa Lí</option>
                <option value="Lịch sử">Lịch sử</option>
                <option value="Vật Lí">Vật Lí</option>
                <option value="Hoá học">Hoá học</option>
                <option value="Toán">Toán</option>
                <!-- Thêm các lĩnh vực khác nếu cần -->
            </select>
            <button type="submit" class="btn-upload">Tải Lên</button>
        </form>
    </div>

    <!-- Nút Chatbot -->
    <button id="chatbot-button" class="chatbot-button">
        <i class="bi bi-chat-dots"></i>
    </button>

    <!-- Cửa Sổ Chatbot -->
    <div id="chatbot-window" class="chatbot-window hidden">
        <div class="chat-area" id="chat-area"></div>
        <input type="text" id="user-input" placeholder="Hỏi gì đó...">
        <button id="send-button">Gửi</button>
    </div>

    <script>
        function toggleUploadForm() {
            $("#uploadForm").slideToggle();
        }

        function handleUpload(event) {
            event.preventDefault();
            var form = event.target;
            var formData = new FormData(form);

            fetch('/lectures/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                $("#uploadMessage").text(data.message).fadeIn().delay(2000).fadeOut();
                form.reset();
                toggleUploadForm();
                loadLectures();
            })
            .catch(error => {
                console.error('Lỗi:', error);
            });
        }

        function loadLectures() {
            fetch('/lectures/files')
            .then(response => response.json())
            .then(data => {
                var lecturesList = $(".lectures-list");
                lecturesList.empty();
                data.forEach(file => {
                    var fileType = file.name.split('.').pop().toLowerCase();
                    var thumbnail = (fileType === "pdf") ? `/thumbnails/${file.name}.jpg` : file.path;

                    lecturesList.append(`
                        <li class="lecture-item">
                            <img src="${thumbnail}" alt="Thumbnail" class="lecture-thumbnail">
                            <a href="${file.path}" target="_blank">${file.name}</a>
                            <p>Lĩnh vực: ${file.category}</p>
                        </li>
                    `);
                });
            })
            .catch(error => {
                console.error('Lỗi:', error);
            });
        }

        $(document).ready(loadLectures);
    </script>
    <script src="js/scripts.js"></script>
</body>
</html>
